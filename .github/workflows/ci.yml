name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  # Deployment is triggered by Coolify's own GitHub webhook on push to
  # main, not from here. Keeping deploy out of Actions means one system
  # owns the pipeline and there is no race between the two.
